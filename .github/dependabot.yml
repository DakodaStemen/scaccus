# Dependabot: github-actions is the only ecosystem (the C engine has no package manager).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns: ["*"]
